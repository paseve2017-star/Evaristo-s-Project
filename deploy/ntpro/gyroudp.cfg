; ============================================================
; NTPRO UHI link file - Gyro Compass Repeater (UDP broadcast)
; Target: 192.168.0.255:4001  (LAN broadcast, any PC can listen)
; ============================================================

[SerialToAddress]
;Script_ID=Physical_ID
; gyrorepeater.uhs uses MBSEN "|3" (existing: 1=OverheadDef, 2=OverheadZD).
; Only add a mapping here if your NmeaPort setup routes by Script_ID.

[Calibration]

[Plugins]
; ------------------------------------------------------------
; NOTE (2026-09-02): analysis of NmeaPort.dll v5.10.5450 shows it is a
; SERIAL-ONLY component (4800 8N1; no UDP/TCP transport inside the DLL).
; It reads its sentence table from Nmea.ini (via GetPrivateProfileSection),
; so its host-app parameter is the ini file itself.
; Plan: this link -> NmeaPort -> COM3 (com0com pair) -> serial_to_udp.py
; (reads COM4) -> UDP unicast 192.168.0.20:4001 -> web repeater.
;
; CANDIDATE line (mirrors the OVERHEAD.CFG pattern "Plugin.HostApp = file"):
NmeaPort.HostApp = "Nmea.ini"
;
; If Nmea.exe refuses to load it, compare with the plugin line in UHI.CFG /
; NAVHELM.CFG and match that exact format.
; ------------------------------------------------------------

[HardwareGroups]
hwgroup.cfg

[Default]
gyrorepeater.uhs
